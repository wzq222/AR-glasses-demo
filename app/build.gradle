apply plugin: 'com.android.application'

def crrcVisionModelDir = System.getenv('CRRC_VISION_MODEL_DIR')
def detectorBackend = (System.getenv('CRRC_DETECTOR_BACKEND') ?: 'onnx').trim().toLowerCase()
def ncnnAndroidRoot = System.getenv('CRRC_NCNN_ANDROID_ROOT')
def ncnnModelDir = System.getenv('CRRC_NCNN_MODEL_DIR')
def ncnnJniBuildRoot = System.getenv('CRRC_NCNN_JNI_BUILD_ROOT')
def ncnnConfidenceThreshold = (System.getenv('CRRC_NCNN_CONFIDENCE_THRESHOLD') ?: '0.20').toFloat()
def ncnnExactMath = (System.getenv('CRRC_NCNN_EXACT_MATH') ?: '0') == '1'
def filteredJniLibsDir = file("$buildDir/generated/filteredJniLibs")
def filteredNcnnModelDir = file("$buildDir/generated/filteredNcnnModel")
def filteredOnnxModelDir = file("$buildDir/generated/filteredOnnxModel")

if (!(detectorBackend in ['onnx', 'ncnn'])) {
    throw new GradleException("CRRC_DETECTOR_BACKEND must be onnx or ncnn")
}
if (ncnnConfidenceThreshold < 0.0f || ncnnConfidenceThreshold > 1.0f) {
    throw new GradleException("CRRC_NCNN_CONFIDENCE_THRESHOLD must be from 0 to 1")
}
if (detectorBackend == 'ncnn'
        && (ncnnAndroidRoot == null || ncnnAndroidRoot.trim().isEmpty()
            || ncnnModelDir == null || ncnnModelDir.trim().isEmpty()
            || ncnnJniBuildRoot == null || ncnnJniBuildRoot.trim().isEmpty())) {
    throw new GradleException(
            "ncnn builds require CRRC_NCNN_ANDROID_ROOT, CRRC_NCNN_MODEL_DIR, "
                    + "and CRRC_NCNN_JNI_BUILD_ROOT")
}

task prepareFilteredJniLibs(type: Sync) {
    from('src/main/jniLibs') {
        exclude '**/libonnxruntime.so'
    }
    into filteredJniLibsDir
}

if (detectorBackend == 'ncnn') {
    task prepareFilteredNcnnModel(type: Sync) {
        from(ncnnModelDir) {
            include 'model.ncnn.param', 'model.ncnn.bin'
        }
        into filteredNcnnModelDir
    }
}
if (crrcVisionModelDir != null && !crrcVisionModelDir.trim().isEmpty()) {
    task prepareFilteredOnnxModel(type: Sync) {
        from(crrcVisionModelDir) {
            include 'fastener-target-p2-640.onnx'
        }
        into filteredOnnxModelDir
    }
}

android {
    compileSdkVersion 34
    buildToolsVersion "34.0.0"
    defaultConfig {
        applicationId "com.ar.glass"
        minSdkVersion 22
        targetSdkVersion 33
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
        buildConfigField 'String', 'DETECTOR_BACKEND', "\"${detectorBackend}\""
        buildConfigField 'float', 'NCNN_CONFIDENCE_THRESHOLD',
                "${ncnnConfidenceThreshold}f"
        ndk{
            abiFilters 'armeabi-v7a','arm64-v8a'
        }
        // 云端视觉 API 配置（万用表读数识别），在根目录 gradle.properties 中填写
        def arkBaseUrl = project.hasProperty('ARK_BASE_URL')
                ? project.property('ARK_BASE_URL')
                : "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
        def arkApiKey = project.hasProperty('ARK_API_KEY') ? project.property('ARK_API_KEY') : ""
        def arkModel = project.hasProperty('ARK_MODEL') ? project.property('ARK_MODEL') : "qwen3-vl-flash"
        buildConfigField "String", "ARK_BASE_URL", "\"${arkBaseUrl}\""
        buildConfigField "String", "ARK_API_KEY", "\"${arkApiKey}\""
        buildConfigField "String", "ARK_MODEL", "\"${arkModel}\""
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        abortOnError false
    }
    sourceSets {
        main {
            if (crrcVisionModelDir != null && !crrcVisionModelDir.trim().isEmpty()) {
                assets.srcDir filteredOnnxModelDir
            }
            if (detectorBackend == 'ncnn') {
                assets.srcDir filteredNcnnModelDir
            }
            jniLibs.srcDirs = [filteredJniLibsDir]
        }
    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        // jniLibs 与 onnxruntime-android AAR 均提供 libonnxruntime.so /
        // libc++_shared.so（内容已统一为官方 1.19.2 版本），重复时取其一
        pickFirst 'lib/**/libonnxruntime.so'
        pickFirst 'lib/**/libc++_shared.so'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'

    implementation 'org.slf4j:slf4j-api:1.7.25'
    implementation 'org.slf4j:slf4j-simple:1.7.25'

    implementation 'io.netty:netty-all:4.1.68.Final'
    implementation 'com.google.protobuf:protobuf-javalite:3.18.1'
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    // YOLO 离线目标检测（ONNX Runtime，NNAPI 硬件加速）
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'

    implementation files('libs/ksdk-release.aar')
    // 讯飞 SparkChain SDK（在线语音听写）
    implementation files('libs/SparkChain.aar')
    implementation files('libs/Codec.aar')
    implementation 'com.google.code.gson:gson:2.8.8'

    testImplementation 'junit:junit:4.13.2'
}

preBuild.dependsOn prepareFilteredJniLibs
if (detectorBackend == 'ncnn') {
    preBuild.dependsOn prepareFilteredNcnnModel
}
if (crrcVisionModelDir != null && !crrcVisionModelDir.trim().isEmpty()) {
    preBuild.dependsOn prepareFilteredOnnxModel
}

if (detectorBackend == 'ncnn') {
    def normalizedJniRoot = ncnnJniBuildRoot.replace('\\', '/')
    def normalizedNcnnRoot = ncnnAndroidRoot.replace('\\', '/')
    def cmakeExecutable = "${android.sdkDirectory}/cmake/3.31.6/bin/cmake.exe"
    def ninjaExecutable = "${android.sdkDirectory}/cmake/3.31.6/bin/ninja.exe"
    def toolchainFile = "${android.sdkDirectory}/ndk/25.1.8937393/build/cmake/android.toolchain.cmake"
    def nativeSourceDir = "${normalizedJniRoot}/source"

    task prepareNcnnNativeSource(type: Sync) {
        from('src/main/cpp')
        into(nativeSourceDir)
    }

    ['arm64-v8a', 'armeabi-v7a'].each { abi ->
        def taskSuffix = abi == 'arm64-v8a' ? 'Arm64' : 'Armv7'
        def buildDirectory = "${normalizedJniRoot}/build/${abi}"
        def installDirectory = "${normalizedJniRoot}/install/${abi}"
        def configureTask = tasks.create("configureNcnn${taskSuffix}", Exec) {
            dependsOn prepareNcnnNativeSource
            inputs.dir nativeSourceDir
            inputs.property 'ncnnAndroidRoot', normalizedNcnnRoot
            inputs.property 'androidAbi', abi
            inputs.property 'ncnnExactMath', ncnnExactMath
            outputs.file "${buildDirectory}/build.ninja"
            commandLine cmakeExecutable,
                    '-S', nativeSourceDir,
                    '-B', buildDirectory,
                    '-G', 'Ninja',
                    "-DCMAKE_MAKE_PROGRAM=${ninjaExecutable}",
                    "-DCMAKE_TOOLCHAIN_FILE=${toolchainFile}",
                    "-DANDROID_ABI=${abi}",
                    '-DANDROID_PLATFORM=android-21',
                    '-DANDROID_STL=c++_static',
                    '-DCMAKE_BUILD_TYPE=Release',
                    "-DCMAKE_INSTALL_PREFIX=${installDirectory}",
                    "-DCRRC_NCNN_ANDROID_ROOT=${normalizedNcnnRoot}",
                    "-DCRRC_NCNN_EXACT_MATH=${ncnnExactMath ? 'ON' : 'OFF'}"
        }
        def buildTask = tasks.create("buildNcnn${taskSuffix}", Exec) {
            dependsOn configureTask
            inputs.dir nativeSourceDir
            inputs.file "${buildDirectory}/build.ninja"
            outputs.file "${installDirectory}/libcrrc_ncnn.so"
            commandLine cmakeExecutable,
                    '--build', buildDirectory,
                    '--target', 'install',
                    '--parallel', '8'
        }
        prepareFilteredJniLibs.dependsOn buildTask
        prepareFilteredJniLibs.from(installDirectory) {
            include 'libcrrc_ncnn.so'
            into abi
        }
    }
}
