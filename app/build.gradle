apply plugin: 'com.android.application'

def crrcVisionModelDir = System.getenv('CRRC_VISION_MODEL_DIR')
def filteredJniLibsDir = file("$buildDir/generated/filteredJniLibs")

task prepareFilteredJniLibs(type: Sync) {
    from('src/main/jniLibs') {
        exclude '**/libonnxruntime.so'
    }
    into filteredJniLibsDir
}

android {
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.ar.glass"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0.0"
        ndk{
            abiFilters 'armeabi-v7a','arm64-v8a'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        abortOnError false
    }
    sourceSets {
        main {
            if (crrcVisionModelDir != null && !crrcVisionModelDir.trim().isEmpty()) {
                assets.srcDir crrcVisionModelDir
            }
            jniLibs.srcDirs = [filteredJniLibsDir]
        }
        test.resources.srcDirs += ['../test-vectors']
    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.greenrobot:eventbus:3.3.1'

    implementation 'org.slf4j:slf4j-api:1.7.25'
    implementation 'org.slf4j:slf4j-simple:1.7.25'

    implementation 'io.netty:netty-all:4.1.68.Final'
    implementation 'com.google.protobuf:protobuf-javalite:3.18.1'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.1'
    implementation 'androidx.camera:camera-core:1.2.3'
    implementation 'androidx.camera:camera-camera2:1.2.3'
    implementation 'androidx.camera:camera-lifecycle:1.2.3'
    implementation 'androidx.camera:camera-view:1.2.3'

    implementation files('libs/ksdk-release.aar')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

preBuild.dependsOn prepareFilteredJniLibs
