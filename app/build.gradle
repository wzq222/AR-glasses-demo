apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    buildToolsVersion "34.0.0"
    defaultConfig {
        applicationId "com.ar.glass"
        minSdkVersion 22
        targetSdkVersion 33
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
        ndk{
            abiFilters 'armeabi-v7a','arm64-v8a'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        abortOnError false
    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        // jniLibs 与 onnxruntime-android AAR 均提供 libonnxruntime.so /
        // libc++_shared.so（内容已统一为官方 1.19.2 版本），重复时取其一
        pickFirst 'lib/**/libonnxruntime.so'
        pickFirst 'lib/**/libc++_shared.so'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'

    implementation 'org.slf4j:slf4j-api:1.7.25'
    implementation 'org.slf4j:slf4j-simple:1.7.25'

    implementation 'io.netty:netty-all:4.1.68.Final'
    implementation 'com.google.protobuf:protobuf-javalite:3.18.1'
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    // YOLO 离线目标检测（ONNX Runtime，NNAPI 硬件加速）
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'

    implementation files('libs/ksdk-release.aar')

    // 讯飞 SparkChain SDK（在线语音听写）
    implementation files('libs/SparkChain.aar')
    implementation files('libs/Codec.aar')
    implementation 'com.google.code.gson:gson:2.8.8'
}
