<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>中车眼镜 · 巡检管理平台</title>
  <style>
    :root{--ink:#162331;--muted:#69798a;--line:#dde5eb;--bg:#f4f7f9;--nav:#122637;--blue:#176fa8;--cyan:#0e91a7;--green:#13835d;--amber:#b56d08;--red:#b5473c;--shadow:0 8px 30px #18384d12}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px/1.55 Inter,"Microsoft YaHei",system-ui,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}.hidden{display:none!important}
    button{border:0;border-radius:8px;padding:9px 14px;cursor:pointer;background:var(--blue);color:#fff;font-weight:650;transition:.18s}button:hover{filter:brightness(.96);transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}.secondary{background:#e9eff3;color:#33495b}.danger{background:#fff0ed;color:var(--red)}.wide{width:100%}
    input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:#4a94bd;box-shadow:0 0 0 3px #2388bd18}textarea{min-height:86px;resize:vertical}.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:700;color:#536577;margin-bottom:5px}.help{font-size:12px;color:var(--muted)}
    .login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 22% 20%,#29627b 0,#16394d 28%,#102536 72%)}.login-card{width:min(410px,92vw);background:#fff;padding:38px;border-radius:18px;box-shadow:0 28px 90px #001d}.login-mark{width:48px;height:48px;border-radius:13px;background:linear-gradient(135deg,var(--cyan),var(--blue));display:grid;place-items:center;color:#fff;font-size:22px;margin-bottom:18px}.brand{font-size:24px;font-weight:800}.sub{color:var(--muted);margin:4px 0 24px}.error{color:var(--red);min-height:22px;margin-top:-4px}
    .shell{min-height:100vh;display:grid;grid-template-columns:232px 1fr}.sidebar{background:linear-gradient(180deg,var(--nav),#10202e);color:#fff;padding:22px 14px;position:fixed;inset:0 auto 0 0;width:232px;z-index:5}.side-brand{padding:4px 10px 24px}.side-brand strong{font-size:18px;display:block}.side-brand span{font-size:12px;color:#9fb4c2}.nav-label{padding:10px 10px 6px;color:#7391a4;font-size:11px;font-weight:800;letter-spacing:.12em}.nav-btn{width:100%;display:flex;align-items:center;gap:11px;background:transparent;color:#b9cad5;text-align:left;margin:3px 0;padding:11px 12px}.nav-btn:hover,.nav-btn.active{background:#ffffff12;color:#fff;transform:none}.nav-btn.active{box-shadow:inset 3px 0 var(--cyan)}.nav-icon{width:25px;text-align:center;font-size:17px}.main-wrap{grid-column:2;min-width:0}.topbar{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:4}.crumb{font-size:16px;font-weight:750}.top-user{display:flex;align-items:center;gap:12px;color:#536577}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#dceef4;color:#12667c;font-weight:800}.content{padding:24px;max-width:1680px;margin:auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}.page-head h1{margin:0;font-size:23px}.page-head p{margin:4px 0 0;color:var(--muted)}
    .cards{display:grid;grid-template-columns:repeat(5,minmax(135px,1fr));gap:13px;margin-bottom:20px}.metric-card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.metric-card{padding:17px}.metric-card .value{font-size:27px;font-weight:800;margin-top:6px}.metric-card .label{color:var(--muted)}.panel{padding:18px;overflow:auto}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}.panel-head h2{font-size:17px;margin:0}
    table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf1f4}th{font-size:12px;color:#526473;background:#f9fbfc}.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:99px;background:#e8eef3;color:#486071;font-size:12px}.badge.completed,.badge.reviewed{background:#dff5eb;color:#08744b}.badge.submitted{background:#fff0cb;color:#8a5a00}.badge.in_progress{background:#e0f0fa;color:#17648d}.badge.inspector{background:#e6f4f6;color:#147083}.badge.admin{background:#eee8fb;color:#6744a1}
    .flow-layout{display:grid;grid-template-columns:210px minmax(440px,1fr) 300px;gap:14px;align-items:start}.flow-toolbar{grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}.flow-toolbar .grow{flex:1}.flow-toolbar select{width:auto;min-width:250px;margin:0}.version{background:#e6f4f6;color:#147083;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:750}
    .toolbox,.inspector,.canvas-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.toolbox,.inspector{padding:15px;position:sticky;top:84px}.section-title{font-size:13px;font-weight:800;margin-bottom:5px}.section-note{font-size:12px;color:var(--muted);margin-bottom:13px}.palette{display:grid;gap:8px}.palette-item{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fbfcfd;cursor:pointer;display:grid;grid-template-columns:34px 1fr;gap:9px;align-items:center}.palette-item:hover{border-color:#71a8c4;background:#f1f8fb}.node-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:850;color:#fff}.node-icon.QR{background:#2379a8}.node-icon.FASTENER_MARK{background:#b56d08}.node-icon.METER{background:#13835d}.node-icon.PHOTO{background:#6c63a8}.node-icon.HUMAN_CONFIRM{background:#a04461}.palette-item strong{font-size:13px;display:block}.palette-item small{color:var(--muted)}
    .canvas-wrap{min-height:650px;overflow:hidden}.canvas-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.canvas-head h2{margin:0;font-size:16px}.flow-meta{padding:15px 18px;background:#fafcfd;border-bottom:1px solid var(--line);display:grid;grid-template-columns:160px 1fr 1.5fr;gap:10px}.flow-meta input{margin:0}.flow-canvas{padding:28px 22px 36px;min-height:410px;background-color:#f8fafb;background-image:radial-gradient(#cbd8e0 1px,transparent 1px);background-size:20px 20px;display:flex;align-items:stretch;justify-content:center;gap:34px;overflow-x:auto}.flow-node{position:relative;flex:0 0 220px;min-height:235px;background:#fff;border:2px solid #dce6ec;border-radius:14px;box-shadow:0 9px 25px #18384d13;padding:15px;cursor:pointer;transition:.18s}.flow-node:hover{border-color:#72a8c4;transform:translateY(-2px)}.flow-node.selected{border-color:var(--blue);box-shadow:0 0 0 4px #207caf18,0 12px 30px #18384d20}.flow-node.dragging{opacity:.45}.flow-node:not(:last-child)::after{content:'›';position:absolute;right:-28px;top:46%;font-size:34px;color:#7ea0b3;font-weight:300}.node-top{display:flex;justify-content:space-between;gap:8px}.step-index{font-size:11px;color:var(--muted);font-weight:750}.node-title{font-size:16px;font-weight:800;margin:13px 0 5px}.node-key{font:11px ui-monospace,monospace;color:#81909d}.node-desc{font-size:12px;color:#5d6d7b;margin:12px 0;height:56px;overflow:hidden}.node-tags{display:flex;flex-wrap:wrap;gap:5px}.tag{padding:3px 7px;border-radius:5px;background:#eff4f7;color:#526879;font-size:11px}.tag.ai{background:#e5f3f7;color:#096f83}.tag.human{background:#fff0df;color:#96550a}.tag.evidence{background:#e9f5ee;color:#14714e}.empty-flow{margin:auto;text-align:center;color:var(--muted);padding:80px 30px}.empty-flow strong{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
    .preview{border-top:1px solid var(--line);padding:16px 18px}.preview-title{font-size:13px;font-weight:800;margin-bottom:10px}.execution-line{display:flex;align-items:center;gap:7px;overflow:auto;padding-bottom:4px}.exec-step{min-width:150px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}.exec-step b{font-size:12px}.exec-step span{display:block;font-size:11px;color:var(--muted)}.exec-arrow{color:#8ba1af}
    .inspector-empty{text-align:center;color:var(--muted);padding:48px 8px}.check-row{display:flex;align-items:flex-start;gap:9px;margin:10px 0}.check-row input{width:auto;margin:3px 0}.check-row label{font-size:12px;color:#405568}.node-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:15px}.node-actions .danger{grid-column:1/-1}.readonly-note{padding:10px;background:#fff7e8;color:#8b5b12;border-radius:8px;font-size:12px;margin-bottom:12px}
    dialog{border:0;border-radius:14px;padding:0;width:min(620px,94vw);box-shadow:0 24px 80px #0017}dialog::backdrop{background:#14263888}.modal{padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h2{margin:0}.close{background:#edf1f4;color:#334;padding:6px 10px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.toast{position:fixed;right:24px;bottom:24px;background:#153348;color:#fff;border-radius:10px;padding:12px 16px;box-shadow:0 12px 35px #0015;z-index:20;max-width:360px}.toast.error-toast{background:#8e3830}
    @media(max-width:1200px){.flow-layout{grid-template-columns:190px 1fr}.inspector{grid-column:1/-1;position:static}.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:780px){.shell{display:block}.sidebar{position:static;width:auto;height:auto;padding:10px}.side-brand{padding:5px 8px 10px}.nav-label{display:none}.sidebar nav{display:flex;overflow:auto}.nav-btn{width:auto;white-space:nowrap}.main-wrap{display:block}.topbar{padding:0 14px}.content{padding:14px}.flow-layout{display:block}.toolbox,.canvas-wrap,.inspector{margin-bottom:12px;position:static}.palette{grid-template-columns:repeat(2,1fr)}.flow-toolbar{flex-wrap:wrap;margin-bottom:12px}.flow-toolbar select{width:100%}.flow-canvas{justify-content:flex-start}.flow-meta{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<section id="login" class="login"><form id="loginForm" class="login-card"><div class="login-mark">轨</div><div class="brand">中车眼镜巡检平台</div><div class="sub">SOP 编排、任务执行与检测证据闭环</div><div class="field"><label>用户名</label><input id="username" autocomplete="username" value="admin" required></div><div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password" required></div><div id="loginError" class="error"></div><button class="wide">登录平台</button></form></section>
<div id="app" class="shell hidden"><aside class="sidebar"><div class="side-brand"><strong>中车眼镜</strong><span>智能巡检管理平台</span></div><div class="nav-label">工作台</div><nav><button class="nav-btn active" data-page="flow"><span class="nav-icon">⌁</span>流程设计</button><button class="nav-btn" data-page="tasks"><span class="nav-icon">▣</span>巡检任务</button><button class="nav-btn" data-page="runs"><span class="nav-icon">◎</span>巡检记录</button><button class="nav-btn" data-page="users"><span class="nav-icon">♙</span>人员管理</button></nav></aside>
  <div class="main-wrap"><header class="topbar"><div id="crumb" class="crumb">流程设计</div><div class="top-user"><div id="avatar" class="avatar">管</div><span id="who"></span><button id="logout" class="secondary">退出</button></div></header><main class="content">
    <section id="flowPage" class="page"><div class="page-head"><div><h1>巡检流程设计</h1><p>把自动检测、证据采集和人工确认编排成可执行的版本化 SOP。</p></div></div><div class="flow-layout">
      <div class="flow-toolbar"><strong>当前流程</strong><select id="templateSelect"></select><span id="versionBadge" class="version">新流程</span><div class="grow"></div><button id="resetFlow" class="secondary">恢复标准三步</button><button id="saveFlow">保存为新版本</button></div>
      <aside class="toolbox"><div class="section-title">节点库</div><div class="section-note">点击添加到流程末尾，也可拖动流程节点排序。</div><div id="palette" class="palette"></div></aside>
      <section class="canvas-wrap"><div class="canvas-head"><div><h2 id="canvasTitle">中车三步巡检</h2><span id="canvasSummary" class="help">3 个步骤</span></div><button id="previewToggle" class="secondary">收起执行预览</button></div><div class="flow-meta"><input id="flowCode" placeholder="流程编码"><input id="flowTitle" placeholder="流程名称"><input id="flowDescription" placeholder="流程说明"></div><div id="flowCanvas" class="flow-canvas"></div><div id="executionPreview" class="preview"><div class="preview-title">手机 / 眼镜执行顺序预览</div><div id="executionLine" class="execution-line"></div></div></section><aside id="inspector" class="inspector"></aside>
    </div></section>
    <section id="tasksPage" class="page hidden"><div class="page-head"><div><h1>巡检任务</h1><p>按点位下发已冻结版本的 SOP，执行中的任务不受后续流程修改影响。</p></div><button id="newAssignment">新建任务</button></div><section class="cards" id="taskCards"></section><section class="panel"><div class="panel-head"><h2>任务列表</h2><button class="secondary" data-refresh>刷新</button></div><div id="assignmentsTable"></div></section></section>
    <section id="runsPage" class="page hidden"><div class="page-head"><div><h1>巡检记录</h1><p>查看步骤进度、提交状态和待复核记录。</p></div><button class="secondary" data-refresh>刷新</button></div><section class="panel"><div id="runsTable"></div></section></section>
    <section id="usersPage" class="page hidden"><div class="page-head"><div><h1>人员管理</h1><p>管理员、巡检员和复核员使用独立权限完成作业闭环。</p></div><button id="newUser">新建用户</button></div><section class="panel"><div id="usersTable"></div></section></section>
  </main></div>
</div>
<dialog id="userDialog"><form id="userForm" class="modal"><div class="modal-head"><h2>新建用户</h2><button type="button" class="close" data-close>关闭</button></div><div class="field"><label>用户名</label><input name="username" required></div><div class="field"><label>姓名</label><input name="display_name" required></div><div class="field"><label>角色</label><select name="role"><option value="inspector">巡检员</option><option value="reviewer">复核员</option><option value="admin">管理员</option></select></div><div class="field"><label>初始密码（至少12位）</label><input name="password" type="password" minlength="12" required></div><div class="actions"><button>创建用户</button></div></form></dialog>
<dialog id="assignmentDialog"><form id="assignmentForm" class="modal"><div class="modal-head"><h2>下发巡检任务</h2><button type="button" class="close" data-close>关闭</button></div><div class="field"><label>SOP 版本</label><select name="template_id" id="assignmentTemplate"></select></div><div class="field"><label>巡检员</label><select name="assignee_id" id="assignmentUser"></select></div><div class="field"><label>设备 / 点位编号</label><input name="asset_code" placeholder="例如：CRRC-CAR01-CAB-A12" required></div><div class="field"><label>截止时间</label><input name="due_at" type="datetime-local"></div><div class="actions"><button>下发任务</button></div></form></dialog><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const state={token:sessionStorage.getItem('crrc_token'),me:null,users:[],templates:[],assignments:[],runs:[],dashboard:{},draft:null,selectedStep:0,preview:true};
const types={PHOTO:{label:'照片采集',icon:'拍',hint:'采集全景或局部证据',analyzer:''},QR:{label:'二维码识别',icon:'码',hint:'识别点位与设备身份',analyzer:'barcode-v1'},FASTENER_MARK:{label:'防松标记检测',icon:'栓',hint:'检出标记点并判断状态',analyzer:'marked-point-v1'},METER:{label:'仪表读数',icon:'表',hint:'识别数值、量程与单位',analyzer:'meter-ocr-v1'},HUMAN_CONFIRM:{label:'人工确认',icon:'核',hint:'处理低置信度与异常项',analyzer:''}};
const standardSteps=()=>[{key:'QR_CHECK',type:'QR',title:'二维码点位确认',instruction:'扫描设备二维码，自动解析点位并核对任务设备',required:true,require_evidence:true,require_human_confirmation:false,config:{analyzer:'barcode-v1',capture_source:'BOTH',failure_action:'RETRY'}},{key:'FASTENER_CHECK',type:'FASTENER_MARK',title:'防松标记检测',instruction:'拍摄检查区域，检测带红黄防松标记的紧固点并逐项确认状态',required:true,require_evidence:true,require_human_confirmation:true,config:{analyzer:'marked-point-v1',capture_source:'BOTH',allowedValues:['ALIGNED','SUSPECTED','UNABLE_TO_JUDGE'],failure_action:'MANUAL_REVIEW'}},{key:'METER_CHECK',type:'METER',title:'万用表读数复核',instruction:'拍摄万用表屏幕，识别数值与单位并由作业人员确认',required:true,require_evidence:true,require_human_confirmation:true,config:{analyzer:'meter-ocr-v1',capture_source:'BOTH',failure_action:'MANUAL_REVIEW'}}];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v?new Date(v).toLocaleString('zh-CN'):'-';
const badge=v=>`<span class="badge ${esc(v)}">${esc(({pending:'待执行',in_progress:'执行中',completed:'已完成',submitted:'待复核',reviewed:'已复核',rejected:'已驳回',admin:'管理员',inspector:'巡检员',reviewer:'复核员'})[v]||v)}</span>`;
function toast(message,error=false){const el=$('#toast');el.textContent=message;el.className='toast'+(error?' error-toast':'');setTimeout(()=>el.classList.add('hidden'),2600)}
async function api(path,opt={}){const headers={...(opt.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opt.headers||{})};if(state.token)headers.Authorization='Bearer '+state.token;const r=await fetch(path,{...opt,headers});let data;try{data=await r.json()}catch{data={detail:'服务响应异常'}}if(!r.ok){if(r.status===401)logout();throw new Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail))}return data}
function table(headers,rows){return `<table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}">暂无数据</td></tr>`}</tbody></table>`}function canEdit(){return state.me?.role==='admin'}
function newDraft(){return {id:null,version:null,code:'CRRC_THREE_STEP',title:'中车三步巡检',description:'二维码、防松标记、万用表固定巡检流程',steps:standardSteps()}}function normalizeTemplate(t){return {id:t.id,version:t.version,code:t.code,title:t.title,description:t.description||'',steps:t.steps.map(s=>({...s,config:{...(s.config||{})}}))}}
function selectTemplate(id){const t=state.templates.find(x=>x.id===+id);state.draft=t?normalizeTemplate(t):newDraft();state.selectedStep=0;renderFlow()}function uniqueKey(type){const base={PHOTO:'PHOTO_CAPTURE',QR:'QR_CHECK',FASTENER_MARK:'FASTENER_CHECK',METER:'METER_CHECK',HUMAN_CONFIRM:'MANUAL_CONFIRM'}[type];let key=base,n=2;const keys=new Set(state.draft.steps.map(s=>s.key));while(keys.has(key))key=base+'_'+n++;return key}
function addStep(type){if(!canEdit())return;const meta=types[type];state.draft.steps.push({key:uniqueKey(type),type,title:meta.label,instruction:meta.hint,required:true,require_evidence:type!=='HUMAN_CONFIRM',require_human_confirmation:type==='HUMAN_CONFIRM'||type==='FASTENER_MARK'||type==='METER',config:{analyzer:meta.analyzer,capture_source:'BOTH',failure_action:type==='HUMAN_CONFIRM'?'STOP':'MANUAL_REVIEW'}});state.selectedStep=state.draft.steps.length-1;renderFlow()}
function moveStep(from,to){if(!canEdit()||to<0||to>=state.draft.steps.length||from===to)return;const [step]=state.draft.steps.splice(from,1);state.draft.steps.splice(to,0,step);state.selectedStep=to;renderFlow()}
function renderPalette(){$('#palette').innerHTML=Object.entries(types).map(([key,t])=>`<div class="palette-item" data-add="${key}"><span class="node-icon ${key}">${t.icon}</span><span><strong>${t.label}</strong><small>${t.hint}</small></span></div>`).join('');$$('[data-add]').forEach(el=>el.onclick=()=>addStep(el.dataset.add))}
function renderFlow(){if(!state.draft)state.draft=newDraft();const d=state.draft;$('#flowCode').value=d.code;$('#flowTitle').value=d.title;$('#flowDescription').value=d.description;$('#canvasTitle').textContent=d.title||'未命名流程';$('#canvasSummary').textContent=`${d.steps.length} 个步骤 · ${d.steps.filter(s=>s.config?.analyzer).length} 个自动检测 · ${d.steps.filter(s=>s.require_human_confirmation).length} 个人工确认`;$('#versionBadge').textContent=d.version?'v'+d.version:'新流程';
  $('#flowCanvas').innerHTML=d.steps.length?d.steps.map((s,i)=>{const t=types[s.type]||types.PHOTO;return `<article class="flow-node ${i===state.selectedStep?'selected':''}" data-index="${i}" draggable="${canEdit()}"><div class="node-top"><span class="node-icon ${s.type}">${t.icon}</span><span class="step-index">STEP ${String(i+1).padStart(2,'0')}</span></div><div class="node-title">${esc(s.title)}</div><div class="node-key">${esc(s.key)}</div><div class="node-desc">${esc(s.instruction)}</div><div class="node-tags">${s.config?.analyzer?'<span class="tag ai">自动检测</span>':''}${s.require_human_confirmation?'<span class="tag human">人工确认</span>':''}${s.require_evidence?'<span class="tag evidence">照片证据</span>':''}</div></article>`}).join(''):`<div class="empty-flow"><strong>流程还是空的</strong>从左侧节点库添加第一个巡检步骤</div>`;
  $('#executionLine').innerHTML=d.steps.map((s,i)=>`${i?'<span class="exec-arrow">→</span>':''}<div class="exec-step"><b>${i+1}. ${esc(s.title)}</b><span>${s.config?.analyzer?'AI检测':'现场操作'}${s.require_human_confirmation?' + 人工确认':''}</span></div>`).join('')||'<span class="help">暂无执行步骤</span>';$('#executionPreview').classList.toggle('hidden',!state.preview);$('#previewToggle').textContent=state.preview?'收起执行预览':'展开执行预览';
  $$('.flow-node').forEach(el=>{el.onclick=()=>{state.selectedStep=+el.dataset.index;renderFlow()};el.ondragstart=e=>{el.classList.add('dragging');e.dataTransfer.setData('text/plain',el.dataset.index)};el.ondragend=()=>el.classList.remove('dragging');el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();moveStep(+e.dataTransfer.getData('text/plain'),+el.dataset.index)}});renderInspector()}
function renderInspector(){const host=$('#inspector'),s=state.draft.steps[state.selectedStep];if(!s){host.innerHTML='<div class="section-title">步骤属性</div><div class="inspector-empty">选择一个节点后在这里编辑</div>';return}const disabled=canEdit()?'':'disabled';host.innerHTML=`<div class="section-title">步骤属性</div><div class="section-note">配置节点的执行方式和质量门。</div>${canEdit()?'':'<div class="readonly-note">复核员可查看流程，只有管理员能发布新版本。</div>'}<div class="field"><label>步骤名称</label><input data-prop="title" value="${esc(s.title)}" ${disabled}></div><div class="field"><label>步骤标识</label><input data-prop="key" value="${esc(s.key)}" ${disabled}></div><div class="field"><label>节点类型</label><select data-prop="type" ${disabled}>${Object.entries(types).map(([k,v])=>`<option value="${k}" ${k===s.type?'selected':''}>${v.label}</option>`).join('')}</select></div><div class="field"><label>现场操作指引</label><textarea data-prop="instruction" ${disabled}>${esc(s.instruction)}</textarea></div><div class="field"><label>检测器 / 算法版本</label><input data-config="analyzer" value="${esc(s.config?.analyzer||'')}" placeholder="不填写表示纯人工步骤" ${disabled}></div><div class="field"><label>采集设备</label><select data-config="capture_source" ${disabled}><option value="BOTH" ${s.config?.capture_source==='BOTH'?'selected':''}>手机或眼镜</option><option value="PHONE" ${s.config?.capture_source==='PHONE'?'selected':''}>仅手机</option><option value="GLASSES" ${s.config?.capture_source==='GLASSES'?'selected':''}>仅眼镜</option></select></div><div class="field"><label>检测失败后</label><select data-config="failure_action" ${disabled}><option value="MANUAL_REVIEW" ${s.config?.failure_action==='MANUAL_REVIEW'?'selected':''}>转人工确认</option><option value="RETRY" ${s.config?.failure_action==='RETRY'?'selected':''}>重新采集</option><option value="STOP" ${s.config?.failure_action==='STOP'?'selected':''}>阻止继续</option></select></div><div class="check-row"><input id="required" type="checkbox" data-bool="required" ${s.required?'checked':''} ${disabled}><label for="required"><b>必做步骤</b><br>未完成时不能提交整次巡检</label></div><div class="check-row"><input id="evidence" type="checkbox" data-bool="require_evidence" ${s.require_evidence?'checked':''} ${disabled}><label for="evidence"><b>必须上传证据</b><br>绑定本步骤的原始现场照片</label></div><div class="check-row"><input id="human" type="checkbox" data-bool="require_human_confirmation" ${s.require_human_confirmation?'checked':''} ${disabled}><label for="human"><b>必须人工确认</b><br>AI结果未经确认不得通过</label></div><div class="node-actions"><button class="secondary" id="movePrev" ${state.selectedStep===0||!canEdit()?'disabled':''}>前移</button><button class="secondary" id="moveNext" ${state.selectedStep===state.draft.steps.length-1||!canEdit()?'disabled':''}>后移</button><button class="danger" id="deleteStep" ${!canEdit()?'disabled':''}>删除步骤</button></div>`;
  $$('[data-prop]').forEach(el=>el.onchange=()=>{s[el.dataset.prop]=el.value;if(el.dataset.prop==='type'&&!s.config.analyzer)s.config.analyzer=types[el.value].analyzer;renderFlow()});$$('[data-config]').forEach(el=>el.onchange=()=>{s.config[el.dataset.config]=el.value;renderFlow()});$$('[data-bool]').forEach(el=>el.onchange=()=>{s[el.dataset.bool]=el.checked;renderFlow()});$('#movePrev').onclick=()=>moveStep(state.selectedStep,state.selectedStep-1);$('#moveNext').onclick=()=>moveStep(state.selectedStep,state.selectedStep+1);$('#deleteStep').onclick=()=>{state.draft.steps.splice(state.selectedStep,1);state.selectedStep=Math.max(0,state.selectedStep-1);renderFlow()}}
function renderTables(){const d=state.dashboard;$('#taskCards').innerHTML=[['有效用户',d.users||0],['SOP版本',d.active_templates||0],['待执行任务',d.pending_assignments||0],['待复核',d.awaiting_review||0],['已完成',d.completed_assignments||0]].map(x=>`<div class="metric-card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('');$('#usersTable').innerHTML=table(['用户名','姓名','角色','状态','创建时间'],state.users.map(x=>`<tr><td>${esc(x.username)}</td><td>${esc(x.display_name)}</td><td>${badge(x.role)}</td><td>${x.active?'启用':'停用'}</td><td>${fmt(x.created_at)}</td></tr>`));$('#assignmentsTable').innerHTML=table(['点位','SOP版本','执行人','状态','截止时间','创建时间'],state.assignments.map(x=>`<tr><td><b>${esc(x.asset_code)}</b></td><td>${esc(x.title)} v${x.version}</td><td>${esc(state.users.find(u=>u.id===x.assignee_id)?.display_name||x.assignee_id)}</td><td>${badge(x.status)}</td><td>${fmt(x.due_at)}</td><td>${fmt(x.created_at)}</td></tr>`));$('#runsTable').innerHTML=table(['点位','SOP','执行人','状态','完成步骤','开始时间','提交时间'],state.runs.map(x=>`<tr><td><b>${esc(x.asset_code)}</b></td><td>${esc(x.sop_title)}</td><td>${esc(x.operator_name)}</td><td>${badge(x.status)}</td><td>${x.step_count}</td><td>${fmt(x.started_at)}</td><td>${fmt(x.submitted_at)}</td></tr>`));$('#assignmentTemplate').innerHTML=state.templates.map(x=>`<option value="${x.id}">${esc(x.title)} v${x.version}</option>`).join('');$('#assignmentUser').innerHTML=state.users.filter(x=>x.role==='inspector'&&x.active).map(x=>`<option value="${x.id}">${esc(x.display_name)} (${esc(x.username)})</option>`).join('')}
function renderTemplateSelect(){const current=state.draft?.id;$('#templateSelect').innerHTML=`<option value="new">＋ 新建流程</option>`+state.templates.map(x=>`<option value="${x.id}" ${x.id===current?'selected':''}>${esc(x.title)} · v${x.version}</option>`).join('');if(!current)$('#templateSelect').value='new'}
async function refresh(keepDraft=true){const [dashboard,users,templates,assignments,runs]=await Promise.all([api('/api/v1/dashboard'),api('/api/v1/users'),api('/api/v1/sop/templates'),api('/api/v1/assignments'),api('/api/v1/runs')]);Object.assign(state,{dashboard,users,templates,assignments,runs});if(!keepDraft||!state.draft){const preferred=templates.find(t=>t.code==='CRRC_THREE_STEP')||templates[0];state.draft=preferred?normalizeTemplate(preferred):newDraft()}renderTemplateSelect();renderFlow();renderTables()}
function validateDraft(){const d=state.draft;if(!/^[A-Z0-9_-]{2,64}$/.test(d.code))throw new Error('流程编码只能使用大写字母、数字、下划线和短横线');if(!d.title.trim())throw new Error('请填写流程名称');if(!d.steps.length)throw new Error('流程至少需要一个步骤');const keys=d.steps.map(s=>s.key);if(new Set(keys).size!==keys.length)throw new Error('步骤标识不能重复');if(keys.some(k=>!/^[A-Z0-9_]{2,64}$/.test(k)))throw new Error('步骤标识只能使用大写字母、数字和下划线');if(d.steps.some(s=>!s.title.trim()||!s.instruction.trim()))throw new Error('每个步骤都需要名称和操作指引')}
async function saveFlow(){try{validateDraft();const payload={code:state.draft.code,title:state.draft.title,description:state.draft.description,steps:state.draft.steps};const created=await api('/api/v1/sop/templates',{method:'POST',body:JSON.stringify(payload)});toast(`已发布 ${created.title} v${created.version}`);state.draft=normalizeTemplate(created);await refresh(true)}catch(e){toast(e.message,true)}}
function showPage(page){$$('.page').forEach(x=>x.classList.add('hidden'));$('#'+page+'Page').classList.remove('hidden');$$('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.page===page));$('#crumb').textContent={flow:'流程设计',tasks:'巡检任务',runs:'巡检记录',users:'人员管理'}[page]}function logout(){sessionStorage.removeItem('crrc_token');location.reload()}
async function boot(){if(!state.token)return;try{state.me=await api('/api/v1/users/me');if(state.me.role==='inspector')throw new Error('巡检员请使用手机端执行任务');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#who').textContent=state.me.display_name+' · '+({admin:'管理员',reviewer:'复核员'}[state.me.role]||state.me.role);$('#avatar').textContent=state.me.display_name.slice(0,1);$('#saveFlow').classList.toggle('hidden',!canEdit());$('#resetFlow').classList.toggle('hidden',!canEdit());$('#newUser').classList.toggle('hidden',!canEdit());renderPalette();await refresh(false)}catch(e){sessionStorage.removeItem('crrc_token');state.token=null;$('#loginError').textContent=e.message}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{const r=await api('/api/v1/auth/login',{method:'POST',body:JSON.stringify({username:$('#username').value,password:$('#password').value})});state.token=r.access_token;sessionStorage.setItem('crrc_token',state.token);await boot()}catch(err){$('#loginError').textContent=err.message}};$('#logout').onclick=logout;$$('.nav-btn').forEach(x=>x.onclick=()=>showPage(x.dataset.page));$$('[data-refresh]').forEach(x=>x.onclick=()=>refresh(true));$$('[data-close]').forEach(x=>x.onclick=()=>x.closest('dialog').close());$('#templateSelect').onchange=e=>{if(e.target.value==='new'){state.draft=newDraft();state.selectedStep=0;renderTemplateSelect();renderFlow()}else selectTemplate(e.target.value)};$('#flowCode').onchange=e=>state.draft.code=e.target.value.toUpperCase();$('#flowTitle').oninput=e=>{state.draft.title=e.target.value;$('#canvasTitle').textContent=e.target.value||'未命名流程'};$('#flowDescription').oninput=e=>state.draft.description=e.target.value;$('#previewToggle').onclick=()=>{state.preview=!state.preview;renderFlow()};$('#resetFlow').onclick=()=>{state.draft.steps=standardSteps();state.selectedStep=0;renderFlow();toast('已恢复标准三步，保存后才会发布')};$('#saveFlow').onclick=saveFlow;$('#newUser').onclick=()=>$('#userDialog').showModal();$('#newAssignment').onclick=()=>$('#assignmentDialog').showModal();
$('#userForm').onsubmit=async e=>{e.preventDefault();try{const obj=Object.fromEntries(new FormData(e.target));await api('/api/v1/users',{method:'POST',body:JSON.stringify(obj)});e.target.closest('dialog').close();e.target.reset();await refresh(true);toast('用户已创建')}catch(err){toast(err.message,true)}};$('#assignmentForm').onsubmit=async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(e.target));await api('/api/v1/assignments',{method:'POST',body:JSON.stringify({template_id:+x.template_id,assignee_id:+x.assignee_id,asset_code:x.asset_code,due_at:x.due_at?new Date(x.due_at).toISOString():null})});e.target.closest('dialog').close();e.target.reset();await refresh(true);toast('巡检任务已下发')}catch(err){toast(err.message,true)}};boot();
</script></body></html>
